# /etc/nginx/sites-available/prenota.tregobbi.it
# Indirizzo pubblico delle prenotazioni dal sito (prenotazioni 2.21, 2026-10-20).
#
# Qui c'è SOLO la pagina di prenotazione:
#  - la pagina (frontend Vite su 5173): su questo host l'app apre sempre la prenotazione,
#    mai il login né il gestionale (App.jsx, hostname «prenota.*»);
#  - il server riceve SOLO /api/public/prenota/* → backend /public/prenota/*.
#    Qualsiasi altro /api/... risponde 404: da qui non si raggiunge altro.
#  - la pagina può stare dentro il sito tregobbi.it (frame-ancestors), app.tregobbi.it no.
#
# Prima volta (vedi docs/deploy.md §«Prenotazioni dal sito»):
#   DNS  prenota  A  80.211.131.156
#   sudo cp deploy/sites/prenota.tregobbi.it/nginx.conf /etc/nginx/sites-available/prenota.tregobbi.it
#   sudo ln -s /etc/nginx/sites-available/prenota.tregobbi.it /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d prenota.tregobbi.it

server {
    listen 80;
    listen [::]:80;
    server_name prenota.tregobbi.it;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Al posto di X-Frame-Options: la pagina può stare dentro il sito dell'osteria
    add_header Content-Security-Policy "frame-ancestors 'self' https://tregobbi.it https://www.tregobbi.it" always;

    # Server: solo le prenotazioni dal sito
    location /api/public/prenota/ {
        proxy_pass http://127.0.0.1:8000/public/prenota/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location = /api/public/prenota {
        proxy_pass http://127.0.0.1:8000/public/prenota;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location /api/ {
        return 404;
    }

    # Pagina (frontend)
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
